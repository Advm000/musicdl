<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' mdl:; img-src 'self' mdl: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Music DL — Mini</title>
<link rel="stylesheet" href="fonts/inter.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;background:#060810;color:#f0f2f7}
.mini{height:100vh;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);position:relative;-webkit-app-region:drag;background:radial-gradient(ellipse 220px 120px at 18% 0%,rgba(79,136,248,.08),transparent 65%),#060810}
button{-webkit-app-region:no-drag;font-family:'Inter',sans-serif}

.art{width:66px;height:66px;border-radius:10px;overflow:hidden;background:#111828;border:1px solid rgba(255,255,255,.07);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}

.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:10px;color:#60a5fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row{display:flex;align-items:center;gap:6px}
.time{font-size:8.5px;color:rgba(255,255,255,.25);font-variant-numeric:tabular-nums;min-width:22px}
.time:last-child{text-align:right}
.bar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:3px;cursor:pointer;-webkit-app-region:no-drag;position:relative}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#4f88f8,#1dd3b0);border-radius:3px}
.ctr{display:flex;align-items:center;gap:2px}
.cb{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:all .13s}
.cb:hover{color:#fff;background:rgba(255,255,255,.07)}
.play{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:#4f88f8;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(79,136,248,.4);transition:all .14s}
.play:hover{background:#3a76f0;transform:scale(1.07)}

.top-acts{position:absolute;top:5px;right:6px;display:flex;gap:3px}
.ta{width:20px;height:20px;border-radius:6px;border:none;cursor:pointer;background:transparent;color:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;transition:all .13s}
.ta:hover{background:rgba(255,255,255,.08);color:#fff}
.ta.close:hover{background:#e81123}
</style>
</head>
<body>
<div class="mini">
  <div class="art" id="art">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.5" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </div>
  <div class="mid">
    <div class="title" id="title">Aucune lecture</div>
    <div class="artist" id="artist">—</div>
    <div class="bar-row">
      <span class="time" id="cur">0:00</span>
      <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
      <span class="time" id="tot">0:00</span>
    </div>
  </div>
  <div class="ctr">
    <button class="cb" id="prev" title="Précédent"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="play" id="play" title="Lecture / pause">
      <svg id="ico-play" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      <svg id="ico-pause" width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
    <button class="cb" id="next" title="Suivant"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg></button>
  </div>
  <div class="top-acts">
    <button class="ta" id="expand" title="Revenir à l'app">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
    <button class="ta close" id="close" title="Fermer le mini-lecteur">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>
<script src="mini.js"></script>
</body>
</html>
