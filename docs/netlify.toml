[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "http://musicdl-official.netlify.app/*"
  to = "https://musicdl-official.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/download"
  to = "https://github.com/Advm000/musicdl/releases/latest/download/MusicDL-Setup.exe"
  status = 302

[[redirects]]
  from = "/github"
  to = "https://github.com/Advm000/musicdl"
  status = 302

[[redirects]]
  from = "/releases"
  to = "https://github.com/Advm000/musicdl/releases"
  status = 302
