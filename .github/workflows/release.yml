name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Python backend (PyInstaller)
        run: pyinstaller musicdl.spec --noconfirm --clean

      - name: Install Electron dependencies
        working-directory: electron
        run: npm install

      - name: Generate app icon from SVG
        working-directory: electron
        run: |
          npm install sharp
          node gen-icon.js

      - name: Build Electron app
        working-directory: electron
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDL-Electron-Installer
          path: electron/dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Music DL ${{ github.ref_name }}
          files: electron/dist-electron/*.exe
          body: |
            ## Music DL ${{ github.ref_name }} — Application Windows Native

            ### Télécharger et installer
            1. Cliquez sur `Music DL Setup 1.0.0.exe` ci-dessous
            2. Exécutez l'installeur
            3. L'app s'ouvre comme une vraie application Windows native

            ### Nouveautés
            - Vraie fenêtre native (plus de navigateur visible)
            - Pas de barre d'adresse, pas de "localhost"
            - Icône dans la barre des tâches

            ### Requis
            - Windows 10 / 11 (64-bit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
